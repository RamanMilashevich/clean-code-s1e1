<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" MEDIA="screen" charset="utf-8">
  </head>
  <body>  
    <header class="header">
      <img src="./eisenhower-matrix.jpg" class="header__img">
      <a href="https://goal-life.com/page/method/matrix-eisenhower" class="header__info">
        Want more details?
      </a>
    </header>
    <main class="main">
      <section class="task new-task">
        <h3 class="task__title">Add Item</h3>
        <div class="task__input task__container">
          <input id="new-task" class="task__input task__input-text" type="text">
          <button class="task__button add">Add</button>
        </div>
      </section>
      <section class="task incompleted_tasks">
        <h3 class="task__title">Todo</h3>
        <ul class="task__list list_incompleted">
          <li class="task__list-items">
            <input type="checkbox" class="task__input task__input-checkbox">
            <label class="task__label">Pay Bills</label>
            <input type="text" class="task__input task__input-text">
            <button class="task__button edit">Edit</button>
            <button class="task__button delete">
              <img src="./remove.svg" class="task__delete-img">
            </button>
          </li>
          <li class="task__list-items editing">
            <input type="checkbox" class="task__input task__input-checkbox">
            <label class="task__label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task__input task__input-text">
            <button class="task__button edit">Save</button>
            <button class="task__button delete">
              <img src="./remove.svg" class="task__delete-img">
            </button>
          </li>
        </ul>
      </section>
      <section class="task completed-tasks">
        <h3 class="task__title">Completed</h3>
        <ul class="task__list completed">
          <li class="task__list-items">
            <input type="checkbox" class="task__input task__input-checkbox" checked>
            <label class="task__label">See the Doctor</label>
            <input type="text" class="task__input task__input-text">
            <button class="task__button edit">Edit</button>
            <button class="task__button delete">
              <img src="./remove.svg" class="task__delete-img">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
